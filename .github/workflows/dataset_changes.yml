name: Dataset changes

on:
  pull_request:
    branches:
      - main
      - release

permissions:
  contents: read

jobs:
  dataset-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Test the proposed merge, including its base parent, without checking out
      # tens of thousands of existing public datasets or the i18n submodule.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            scripts/fixtures
            apps/web/test-fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: node --test scripts/fixtures/check.test.js
      - run: node scripts/fixtures/generate.js --check
      - name: Review changed dataset bytes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/fixtures/check.js --base "$BASE_SHA" --head "$GITHUB_SHA"
