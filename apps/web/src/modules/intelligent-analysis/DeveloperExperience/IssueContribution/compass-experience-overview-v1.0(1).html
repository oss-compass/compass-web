<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>体验洞察 · 总览 | OSS Compass</title>
    <style>
      :root {
        --ink: #1f2733;
        --sub: #6b7686;
        --muted: #98a2b3;
        --line: #eef1f6;
        --line2: #e4e9f2;
        --page: #eff3fa;
        --card: #ffffff;
        --blue: #2a6ff0;
        --green: #12a57b;
        --orange: #f0912b;
        --red: #e5453a;
        --p2: #3d7df6;
        --shadow: 0 2px 10px rgba(31, 56, 102, 0.06);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: linear-gradient(
          180deg,
          #eaf0fa 0%,
          #f5f7fc 320px,
          #f5f7fc 100%
        );
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* 顶部分区切换 */
      .tabsbar {
        position: sticky;
        top: 0;
        z-index: 30;
        padding: 12px 24px;
        background: rgba(245, 247, 252, 0.92);
        backdrop-filter: blur(6px);
      }
      .segs {
        display: inline-flex;
        gap: 2px;
        background: #edeff4;
        border: 1px solid #e2e6ee;
        border-radius: 10px;
        padding: 4px;
      }
      .segs button {
        padding: 5px 20px;
        border-radius: 7px;
        color: var(--sub);
        font-size: 14px;
      }
      .segs button.on {
        background: #fff;
        color: var(--ink);
        font-weight: 600;
        box-shadow: 0 1px 3px rgba(20, 40, 80, 0.12);
      }

      .wrap {
        max-width: 1500px;
        margin: 0 auto;
        padding: 4px 24px 60px;
      }
      h2.sec {
        font-size: 16px;
        font-weight: 700;
        margin: 26px 0 12px;
      }
      .card {
        background: var(--card);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 18px 20px;
      }

      /* 总览信息 4 联卡 */
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        padding: 14px 0;
      }
      .kpi {
        padding: 8px 22px;
        text-align: center;
        border-right: 1px solid var(--line);
      }
      .kpi:last-child {
        border-right: 0;
      }
      .kpi .k {
        color: var(--sub);
        font-size: 13px;
      }
      .kpi .k b {
        color: var(--ink);
        font-weight: 600;
      }
      .kpi .v {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 6px 0 4px;
      }
      .kpi .v strong {
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .kpi .v strong .slash {
        font-style: normal;
        font-size: 20px;
        font-weight: 600;
        color: var(--muted);
        margin-left: 6px;
      }
      .kpi .c {
        color: var(--muted);
        font-size: 12px;
      }

      /* 痛点概览 */
      .pains {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
        margin: 12px 0 4px;
      }
      .pcard {
        border: 1px solid var(--line2);
        border-radius: 10px;
        padding: 12px 14px;
        background: #fcfdff;
      }
      .pcard .k {
        color: var(--sub);
        font-size: 13px;
      }
      .pcard .n {
        font-size: 26px;
        font-weight: 700;
        margin-top: 2px;
        letter-spacing: -0.02em;
      }
      .n.warn {
        color: var(--orange);
      }
      .n.link {
        color: var(--blue);
      }
      h3.sub {
        font-size: 15px;
        font-weight: 700;
        margin: 22px 0 10px;
      }
      .duo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-top: 24px;
      }
      .duocol:first-child {
        padding-right: 26px;
        border-right: 1px solid var(--line);
      }
      .duocol:last-child {
        padding-left: 26px;
      }
      .mini {
        font-size: 13.5px;
        font-weight: 600;
        margin: 0 0 14px;
      }
      .prow {
        display: grid;
        grid-template-columns: 104px 1fr 56px;
        align-items: center;
        gap: 14px;
        padding: 13px 0;
      }
      .prow .pk {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--sub);
        font-size: 12.5px;
        white-space: nowrap;
      }
      .prow .pk em {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex: none;
      }
      .pbar {
        display: flex;
        height: 22px;
        border-radius: 6px;
        overflow: hidden;
        background: #f3f5f9;
      }
      .pbar i {
        display: flex;
        align-items: center;
        justify-content: center;
        font-style: normal;
        font-size: 11px;
        font-weight: 600;
        line-height: 1;
        min-width: 18px;
        white-space: nowrap;
      }
      .prate {
        text-align: right;
        font-weight: 600;
        font-size: 13.5px;
      }
      .stlegend {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
        margin-top: 14px;
        font-size: 12px;
        color: var(--sub);
      }
      .stlegend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stlegend em {
        width: 8px;
        height: 8px;
        border-radius: 2px;
      }
      #weekChart svg {
        width: 100%;
        height: auto;
        display: block;
      }

      /* TOP5 / BOTTOM5 */
      .rank2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .rankcol:first-child {
        padding-right: 26px;
        border-right: 1px solid var(--line);
      }
      .rankcol:last-child {
        padding-left: 26px;
      }
      .sub .hint {
        margin-left: 10px;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
      }
      .ranklist {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .ranklist li {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr) 300px 96px;
        align-items: center;
        gap: 10px;
        padding: 9px 2px;
        border-top: 1px solid var(--line);
      }
      .ranklist li:first-child {
        border-top: 0;
      }
      .rk {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 600;
        background: #f1f4f9;
        color: var(--sub);
      }
      .rk.hi {
        background: #e7f5f0;
        color: var(--green);
      }
      .rk.lo {
        background: #fdecea;
        color: var(--red);
      }
      .rname {
        min-width: 0;
      }
      .rname b {
        display: block;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rname span {
        color: var(--muted);
        font-size: 12px;
      }
      .rscore {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
      }
      .rscore svg {
        display: block;
        flex: none;
      }
      .rhead .rscore {
        justify-content: flex-end;
      }
      .rmetrics {
        display: flex;
        gap: 6px;
        min-width: 0;
      }
      .chip {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--line2);
        border-radius: 7px;
        background: #fcfdff;
        padding: 3px 2px;
        text-align: center;
        line-height: 1.3;
      }
      .chip em {
        display: block;
        font-style: normal;
        font-size: 10.5px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chip b {
        display: block;
        font-size: 12px;
        font-weight: 600;
      }
      .ranklist li.rhead {
        border-top: 0;
        padding: 0 2px 6px;
        color: var(--muted);
        font-size: 11.5px;
      }
      .rhead .rscore {
        font-weight: 400;
        font-size: 11.5px;
        color: var(--muted);
      }
      .rmetrics-h {
        text-align: center;
      }

      /* 评分分布 */
      .sechead2 {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .sechead2 h3 {
        flex: none;
      }
      .headright {
        margin-left: auto;
      }
      .headright {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        justify-content: flex-end;
        margin-left: auto;
      }
      .headright .switch {
        margin-bottom: 0;
      }
      .bandlegend {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 16px;
        font-size: 12.5px;
        color: var(--sub);
      }
      .bandlegend span {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .bandlegend em {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex: none;
      }
      .bandlegend b {
        color: var(--ink);
        font-weight: 600;
      }
      .bandlegend u {
        text-decoration: none;
        color: var(--muted);
      }
      .teamdist {
        display: grid;
        gap: 2px;
      }
      .tdrow {
        display: grid;
        grid-template-columns: 196px 1fr 46px 52px;
        align-items: center;
        gap: 14px;
        padding: 6px 0;
      }
      .tdstage {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 14px 0 4px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink);
      }
      .tdstage u {
        text-decoration: none;
        font-weight: 400;
        color: var(--muted);
        font-size: 11.5px;
      }
      .tdrow.metric .tname {
        padding-left: 10px;
        color: var(--sub);
        font-size: 12.5px;
        display: flex;
        align-items: center;
        gap: 0;
      }
      .mcell {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
      }
      .axis {
        font-size: 10px;
        border-radius: 4px;
        padding: 0 5px;
        margin-left: 6px;
        flex: none;
      }
      .axis.q {
        background: #eaf1ff;
        color: #2a6ff0;
      }
      .axis.e {
        background: #fef3e4;
        color: #c77b14;
      }
      .tdbar i {
        cursor: pointer;
      }
      .tdbar i.act {
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.85);
      }
      .tddetail {
        background: #fafbfd;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px 12px;
        margin: 2px 0 10px;
      }
      .ddhead {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 6px;
      }
      .ddhead u {
        text-decoration: none;
        font-weight: 400;
        color: var(--muted);
        margin-left: 8px;
      }
      .ditem {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        background: #fff;
        border: 1px solid var(--line2);
        border-radius: 6px;
        padding: 3px 9px;
        margin: 4px 6px 0 0;
        font-size: 12px;
      }
      .ditem b {
        font-weight: 500;
      }
      .ditem i {
        font-style: normal;
        color: var(--muted);
        font-size: 11px;
      }
      .ditem em {
        font-style: normal;
        font-weight: 600;
      }
      .tdrow .tname {
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tdbar {
        display: flex;
        height: 14px;
        border-radius: 4px;
        overflow: hidden;
        background: #f3f5f9;
      }
      .tdbar i {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-style: normal;
        font-size: 10px;
        font-weight: 600;
        line-height: 1;
        white-space: nowrap;
        min-width: 18px;
        box-sizing: border-box;
      }
      .tdrow.total {
        padding: 2px 0 12px;
        margin-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      .tdrow.total .tname {
        font-weight: 600;
      }
      .tdrow.total .tdbar {
        height: 24px;
        border-radius: 5px;
      }
      .tdrow.total .tdbar i {
        font-size: 12px;
      }
      .tdn {
        text-align: right;
        color: var(--muted);
        font-size: 12px;
      }
      .tdscore {
        text-align: right;
        font-weight: 600;
        font-size: 13px;
      }

      /* 表格 */
      .tbl {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }
      .tbl thead th {
        background: #f6f8fb;
        color: var(--sub);
        font-weight: 500;
        font-size: 13px;
        padding: 12px 14px;
        text-align: center;
        white-space: nowrap;
        border-bottom: 1px solid var(--line);
      }
      .tbl thead th:first-child {
        border-radius: 8px 0 0 8px;
      }
      .tbl thead th:last-child {
        border-radius: 0 8px 8px 0;
      }
      .tbl td {
        padding: 14px;
        text-align: center;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      .tbl tbody tr:last-child td {
        border-bottom: 0;
      }
      .tbl tbody tr:hover {
        background: #fafbfe;
      }
      .sort {
        display: inline-flex;
        flex-direction: column;
        line-height: 0.6;
        margin-left: 5px;
        color: #c4cbd8;
        font-size: 9px;
        vertical-align: middle;
      }
      th.sortable {
        cursor: pointer;
      }
      th.sortable:hover {
        color: var(--ink);
      }
      th .fi {
        margin-left: 5px;
        color: var(--orange);
      }
      .idx {
        color: var(--muted);
      }
      .score {
        font-weight: 600;
      }
      .good {
        color: var(--green);
      }
      .mid {
        color: var(--orange);
      }
      .plain {
        color: var(--ink);
      }

      /* 各仓库对比 */
      .switch {
        display: inline-flex;
        border: 1px solid var(--line2);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 14px;
      }
      .switch button {
        padding: 5px 16px;
        color: var(--sub);
        font-size: 13px;
      }
      .switch button.on {
        background: #edf3ff;
        color: var(--blue);
        font-weight: 600;
      }
      .team {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .caret {
        width: 16px;
        height: 16px;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 11px;
        transition: transform 0.15s ease;
      }
      .prog {
        width: 100%;
        max-width: 190px;
        min-width: 76px;
        margin: 0 auto;
      }
      .prog .bar {
        display: flex;
        height: 5px;
        border-radius: 3px;
        overflow: hidden;
        background: #eef1f6;
      }
      .prog .bar i {
        font-style: normal;
      }
      .prog .lg {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 7px;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .prog .lg em {
        font-style: normal;
      }
      .lg .t {
        color: var(--orange);
      }
      .lg .d {
        color: var(--sub);
      }
      .lg .c {
        color: var(--green);
      }
      tr.child td {
        background: #fcfdff;
      }
      tr.child .repo {
        display: inline-block;
        padding-left: 24px;
        color: #4c86e8;
        font-weight: 400;
      }
      tr.child .repo:hover {
        text-decoration: underline;
      }
      .scorecell {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
      }
      .scorecell svg {
        display: block;
        flex: none;
      }
      .dash {
        color: var(--muted);
      }
      .tag {
        font-size: 12px;
        font-weight: 600;
        border-radius: 5px;
        padding: 1px 8px;
      }

      .foot {
        color: var(--muted);
        font-size: 12px;
        margin-top: 24px;
      }

      @media (max-width: 1120px) {
        .prog .lg {
          gap: 6px;
          font-size: 11.5px;
        }
        .prog .lg .d {
          display: none;
        }
        .tbl td,
        .tbl thead th {
          padding-left: 10px;
          padding-right: 10px;
        }
      }
      @media (max-width: 940px) {
        .prog .lg .t {
          display: none;
        }
        .tbl td,
        .tbl thead th {
          padding-left: 8px;
          padding-right: 8px;
        }
      }
      @media (max-width: 1200px) {
        .kpis {
          grid-template-columns: repeat(2, 1fr);
          gap: 14px 0;
        }
        .kpi:nth-child(2) {
          border-right: 0;
        }
        .pains {
          grid-template-columns: repeat(3, 1fr);
        }
        .duo {
          grid-template-columns: 1fr;
        }
        .duocol:first-child {
          padding-right: 0;
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding-bottom: 18px;
        }
        .duocol:last-child {
          padding-left: 0;
          padding-top: 18px;
        }
        .bands {
          grid-template-columns: repeat(3, 1fr);
        }
        .rankcol:first-child {
          padding-right: 16px;
        }
        .rankcol:last-child {
          padding-left: 16px;
        }
        .ranklist li {
          grid-template-columns: 20px minmax(0, 1fr) 204px 92px;
          gap: 8px;
        }
        .chip:nth-child(3) {
          display: none;
        }
      }
      @media (max-width: 820px) {
        .wrap,
        .tabsbar {
          padding-left: 14px;
          padding-right: 14px;
        }
        .kpis {
          grid-template-columns: 1fr;
        }
        .kpi {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding-bottom: 14px;
        }
        .kpi:last-child {
          border-bottom: 0;
        }
        .pains {
          grid-template-columns: repeat(2, 1fr);
        }
        .bands {
          grid-template-columns: repeat(2, 1fr);
        }
        .scroll {
          overflow-x: auto;
        }
        #issueTbl {
          min-width: 860px;
        }
      }
      @media (max-width: 900px) {
        .ranklist li {
          grid-template-columns: 20px minmax(0, 1fr) 104px 92px;
        }
        .chip:nth-child(2),
        .chip:nth-child(3) {
          display: none;
        }
      }
      @media (max-width: 700px) {
        .rank2 {
          grid-template-columns: 1fr;
        }
        .rankcol:first-child {
          padding-right: 0;
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding-bottom: 12px;
        }
        .rankcol:last-child {
          padding-left: 0;
        }
        .ranklist li {
          grid-template-columns: 20px minmax(0, 1fr) 204px 92px;
        }
        .chip:nth-child(2) {
          display: inline-block;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="tabsbar">
      <div class="segs" role="tablist">
        <button role="tab" aria-selected="false">社区入门</button>
        <button class="on" role="tab" aria-selected="true">社区贡献</button>
        <button role="tab" aria-selected="false">社区工程</button>
      </div>
    </div>

    <div class="wrap">
      <h2 class="sec">总览信息</h2>
      <div class="card" style="padding: 0 20px">
        <div class="kpis">
          <div class="kpi">
            <div class="k">综合体验评分</div>
            <div class="v">
              <strong class="num">79.3</strong>
              <svg
                width="52"
                height="18"
                viewBox="0 0 52 18"
                aria-hidden="true"
              >
                <path
                  d="M2 14C12 13 20 9 30 6c8-2 14-1 20 0"
                  fill="none"
                  stroke="#12A57B"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <div class="c">最新一周加权</div>

        /* 各指标得分：加权回算后与仓库综合体验评分一致 */
        function metricScores(name, score) {
          var seed = 0,
            i;
          for (i = 0; i < name.length; i++)
            seed = (seed * 31 + name.charCodeAt(i)) % 99991;
          var spread = score < 70 ? 30 : 18,
            d = [],
            mean = 0;
          for (i = 0; i < METRICS.length; i++) {
            seed = (seed * 1103515245 + 12345) % 2147483647;
            d.push((seed / 2147483647 - 0.5) * spread);
          }
          METRICS.forEach(function (m, i) {
            mean += m.sw * m.w * d[i];
          });
          return METRICS.map(function (m, i) {
            return { m: m, v: Math.max(0, Math.min(100, score + d[i] - mean)) };
          });
        }

            ' 分\n' +
            x.m.st +
            ' · ' +
            x.m.ax +
            '轴 · 报告权重 ' +
            Math.round(x.m.sw * 100) +
            '% · 阶段内权重 ' +
            x.m.w.toFixed(2)
          );
        }

        function rankList(id, rows, kind) {
          var head =
            '<li class="rhead"><span></span><span>仓库 / 责任团队</span>' +
            '<span class="rmetrics-h" id="head' +
            (kind === 'hi' ? 'Top' : 'Bottom') +
            '"></span>' +
            '<span class="rscore">综合体验评分</span></li>';
          document.getElementById(id).innerHTML =
            head +
            rows
              .map(function (r, i) {
                var col = bandColor(r.score);
                var ms = metricScores(r.name, r.score)
                  .sort(function (a, b) {
                    return kind === 'hi' ? b.v - a.v : a.v - b.v;
                  })
                  .slice(0, 3);
                var chips = ms
                  .map(function (x) {
                    return (
                      '<span class="chip" title="' +
                      metricTitle(x) +
                      '"><em>' +
                      x.m.name +
                      '</em>' +
                      '<b class="num" style="color:' +
                      bandColor(x.v) +
                      '">' +
                      x.v.toFixed(1) +
                      '</b></span>'
                    );
                  })
                  .join('');
                return (
                  '<li><span class="rk ' +
                  kind +
                  '">' +
                  (i + 1) +
                  '</span>' +
                  '<span class="rname"><b>' +
                  r.name +
                  '</b><span>' +
                  r.team +
                  '</span></span>' +
                  '<span class="rmetrics">' +
                  chips +
                  '</span>' +
                  '<span class="rscore" title="' +
                  r.name +
                  ' 近 8 周综合体验评分走势">' +
                  spark(r.score, col) +
                  '<b class="num" style="color:' +
                  col +
                  '">' +
                  r.score.toFixed(1) +
                  '</b></span></li>'
                );
              })
              .join('');
        }
        var sorted = allRepos.slice().sort(function (a, b) {
          return b.score - a.score;
        });
        rankList('top5', sorted.slice(0, 5), 'hi');
        rankList('bottom5', sorted.slice(-5).reverse(), 'lo');

        /* 指标组上方的说明文字，随可见卡片数变化 */
        function visibleChips() {
          var w = window.innerWidth;
          if (w <= 700) return 2;
          if (w <= 900) return 1;
          if (w <= 1200) return 2;
          return 3;
        }
        function syncHeads() {
          var n = visibleChips();
          var t = document.getElementById('headTop'),
            b = document.getElementById('headBottom');
          if (t) t.textContent = '得分最高的 ' + n + ' 项指标';
          if (b) b.textContent = '得分最低的 ' + n + ' 项指标';
        }
        syncHeads();
        window.addEventListener('resize', syncHeads);

        /* ---------- 评分分布 ---------- */
        var bands = BANDS;
        bands.forEach(function (b) {
          b.n = allRepos.filter(function (r) {
            return b.f(r.score);
          }).length;
        });
        var totalRepos = allRepos.length;
        var over90 = bands[0].n;
        document.getElementById('kpi90').textContent = over90;
        document.getElementById('kpi90sub').textContent =
          '占全部 ' +
          totalRepos +
          ' 个仓库的 ' +
          ((over90 / totalRepos) * 100).toFixed(1).replace(/\.0$/, '') +
          '%';
        document.getElementById('bandLegend').innerHTML = bands
          .map(function (b) {
            return (
              '<span><em style="background:' + b.c + '"></em>' + b.k + '</span>'
            );
          })
          .join('');

        /* 顶部整体条与下方明细条共用同一套网格，段内直接标数 */
        var maxRepos = Math.max.apply(
          null,
          teams.map(function (t) {
            return t.list.length;
          })
        );
        function segsOf(counts, total, label, scope) {
          return bands
            .map(function (b, i) {
              var n = counts[i];
              if (!n) return '';
              return (
                '<i style="width:' +
                ((n / total) * 100).toFixed(2) +
                '%;background:' +
                b.c +
                '" title="' +
                label +
                ' · ' +
                b.k +
                '：' +
                n +
                ' 个，点击查看明细" data-band="' +
                i +
                '" ' +
                scope +
                '>' +
                n +
                '</i>'
              );
            })
            .join('');
        }
        function bandIndex(v) {
          for (var i = 0; i < bands.length; i++) {
            if (bands[i].f(v)) return i;
          }
          return bands.length - 1;
        }

        var totalRow =
          '<div class="tdrow total"><span class="tname">全部分队仓库</span>' +
          '<span class="tdbar">' +
          segsOf(
            bands.map(function (b) {
              return b.n;
            }),
            totalRepos,
            '全部仓库',
            'data-scope="all"'
          ) +
          '</span>' +
          '<span class="tdn num">' +
          totalRepos +
          ' 个</span>' +
          '<span class="tdscore num" style="color:' +
          bandColor(79.3) +
          '">79.3</span></div>';

        /* 维度一：各分队的分档构成，条长表示仓库数 */
        var teamRows = teams
          .slice()
          .sort(function (a, b) {
            return b.score - a.score;
          })
          .map(function (t) {
            var counts = bands.map(function (b) {
              return t.list.filter(function (r) {
                return b.f(r[1]);
              }).length;
            });
            return (
              '<div class="tdrow"><span class="tname">' +
              t.name +
              '</span>' +
              '<span class="tdbar" style="width:' +
              ((t.list.length / maxRepos) * 100).toFixed(1) +
              '%">' +
              segsOf(
                counts,
                t.list.length,
                t.name,
                'data-scope="team" data-team="' + t.name + '"'
              ) +
              '</span>' +
              '<span class="tdn num">' +
              t.list.length +
              ' 个</span>' +
              '<span class="tdscore num" style="color:' +
              bandColor(t.score) +
              '">' +
              t.score.toFixed(1) +
              '</span></div>'
            );
          })
          .join('');

        /* 维度二：按阶段与具体指标，统计各分数段的仓库个数 */
        var MS = allRepos.map(function (r) {
          return metricScores(r.name, r.score);
        });
        var metricRows = (function () {
          var out = '',
            curStage = '';
          METRICS.forEach(function (m, mi) {
            if (m.st !== curStage) {
              curStage = m.st;
              var sw = Math.round(m.sw * 100);
              out +=
                '<div class="tdstage">' +
                m.st +
                '<u>报告权重 ' +
                sw +
                '%</u></div>';
            }
            var counts = [0, 0, 0, 0, 0],
              sum = 0;
            MS.forEach(function (list) {
              var v = list[mi].v;
              counts[bandIndex(v)]++;
              sum += v;
            });
            var avg = sum / MS.length;
            out +=
              '<div class="tdrow metric"><span class="tname" title="' +
              m.name +
              '（' +
              m.key +
              '）· ' +
              m.ax +
              '轴 · 阶段内权重 ' +
              m.w.toFixed(2) +
              '">' +
              m.name +
              '<span class="axis ' +
              (m.ax === '效率' ? 'e' : 'q') +
              '">' +
              m.ax +
              '</span></span>' +
              '<span class="tdbar">' +
              segsOf(
                counts,
                MS.length,
                m.name,
                'data-scope="metric" data-mi="' + mi + '"'
              ) +
              '</span>' +
              '<span class="tdn num">' +
              MS.length +
              ' 个</span>' +
              '<span class="tdscore num" style="color:' +
              bandColor(avg) +
              '">' +
              avg.toFixed(1) +
              '</span></div>';
          });
          return out;
        })();

        function renderDist(dim) {
          document.getElementById('teamDist').innerHTML =
            dim === 'metric' ? metricRows : totalRow + teamRows;
          document.getElementById('bandHint').textContent =
            dim === 'metric'
              ? '共 ' + totalRepos + ' 个仓库，按各指标得分分档统计仓库个数'
              : '共 ' + totalRepos + ' 个仓库，按最新一周综合体验评分分档';
        }
        renderDist('team');

        /* 点击任意色段，展开该分档下的仓库明细 */
        document
          .getElementById('teamDist')
          .addEventListener('click', function (e) {
            var seg = e.target.closest('i[data-band]');
            if (!seg) return;
            var row = seg.closest('.tdrow'),
              open = row.nextElementSibling;
            var key =
              seg.dataset.band +
              '|' +
              (seg.dataset.scope || '') +
              '|' +
              (seg.dataset.team || seg.dataset.mi || '');
            if (open && open.classList.contains('tddetail')) {
              var same = open.dataset.key === key;
              open.remove();
              if (same) {
                seg.classList.remove('act');
                return;
              }
            }
            row.querySelectorAll('i.act').forEach(function (x) {
              x.classList.remove('act');
            });
            seg.classList.add('act');
            var b = bands[+seg.dataset.band],
              items;
            if (seg.dataset.scope === 'metric') {
              var mi = +seg.dataset.mi;
              items = allRepos
                .map(function (r, i) {
                  return { n: r.name, t: r.team, v: MS[i][mi].v, s: r.score };
                })
                .filter(function (x) {
                  return b.f(x.v);
                });
            } else {
              items = allRepos
                .filter(function (r) {
                  return (
                    b.f(r.score) &&
                    (seg.dataset.scope !== 'team' ||
                      r.team === seg.dataset.team)
                  );
                })
                .map(function (r) {
                  return { n: r.name, t: r.team, v: r.score, s: r.score };
                });
            }
            items.sort(function (a, c) {
              return c.v - a.v;
            });
            var scopeName =
              seg.dataset.scope === 'metric'
                ? METRICS[+seg.dataset.mi].name
                : seg.dataset.team || '全部仓库';
            var d = document.createElement('div');
            d.className = 'tddetail';
            d.dataset.key = key;
            d.innerHTML =
              '<div class="ddhead">' +
              scopeName +
              ' · ' +
              b.k +
              '<u>' +
              items.length +
              ' 个仓库</u></div>' +
              items
                .map(function (x) {
                  return (
                    '<span class="ditem"><b>' +
                    x.n +
                    '</b><i>' +
                    x.t +
                    '</i>' +
                    '<em class="num" style="color:' +
                    bandColor(x.v) +
                    '">' +
                    x.v.toFixed(1) +
                    '</em></span>'
                  );
                })
                .join('');
            row.insertAdjacentElement('afterend', d);
          });
        document.querySelectorAll('#distDim button').forEach(function (b) {
          b.addEventListener('click', function () {
            document.querySelectorAll('#distDim button').forEach(function (x) {
              x.classList.remove('on');
            });
            b.classList.add('on');
            renderDist(b.dataset.dim);
          });
        });

        /* 子行的小面积图 */
        function spark(score, col) {
          col = col || '#12A57B';
          var seed = Math.round(score * 10),
            v = [],
            i;
          for (i = 0; i < 8; i++) {
            seed = (seed * 1103515245 + 12345) % 2147483647;
            v.push(seed / 2147483647);
          }
          var pts = v.map(function (y, i) {
            return [4 + i * 4.6, 20 - 4 - y * 9 - i * 0.5];
          });
          var d = pts
            .map(function (p, i) {
              return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
            })
            .join(' ');
          return (
            '<svg width="38" height="22" viewBox="0 0 38 22" aria-hidden="true">' +
            '<path d="' +
            d +
            'L36 22L4 22Z" fill="' +
            col +
            '" fill-opacity=".14"/>' +
            '<path d="' +
            d +
            '" fill="none" stroke="' +
            col +
            '" stroke-width="1.6" stroke-linejoin="round"/></svg>'
          );
        }
        function progress(t) {
          var sum = t.todo + t.doing + t.done || 1;
          var seg = [
            [t.todo, '#F0912B'],
            [t.doing, '#3D7DF6'],
            [t.done, '#12A57B'],
          ];
          return (
            '<div class="prog"><div class="bar">' +
            seg
              .map(function (s) {
                return s[0]
                  ? '<i style="width:' +
                      ((s[0] / sum) * 100).toFixed(2) +
                      '%;background:' +
                      s[1] +
                      '"></i>'
                  : '';
              })
              .join('') +
            '</div>' +
            '<div class="lg"><em class="t">待处理 ' +
            t.todo +
            '</em><em class="d">进行中 ' +
            t.doing +
            '</em>' +
            '<em class="c">已闭环 ' +
            t.done +
            '</em></div></div>'
          );
        }
        /* 迷你趋势图：闭环率为 0 时画平线，避免暗示不存在的走势 */
        function rateSpark(rate) {
          if (!rate)
            return (
              '<svg width="38" height="22" viewBox="0 0 38 22" aria-hidden="true">' +
              '<line x1="4" y1="17" x2="34" y2="17" stroke="#C4CBD8" stroke-width="1.6" stroke-linecap="round"/></svg>'
            );
          return spark(rate, '#12A57B');
        }

        var dim = 'team',
          opened = {};
        var HEADS = {
          team: [
            ['序号', ''],
            ['责任团队', 'name'],
            ['负责仓库', 'repos'],
            ['综合体验评分', 'score'],
            ['问题处理进展', null],
            ['总问题数', 'total'],
            ['闭环率', 'rate'],
            ['最新报告', 'report'],
          ],
          repo: [
            ['序号', ''],
            ['仓库', 'name'],
            ['责任团队', 'team'],
            ['综合体验评分', 'score'],
            ['问题处理进展', null],
            ['总问题数', 'total'],
            ['闭环率', 'rate'],
            ['最新报告', 'report'],
          ],
        };
        function drawHead() {
          document.getElementById('teamHead').innerHTML =
            '<tr>' +
            HEADS[dim]
              .map(function (h, i) {
                var style =
                  i === 0
                    ? ' style="width:80px"'
                    : i === 1
                    ? ' style="text-align:left;padding-left:24px"'
                    : '';
                if (h[1] === null)
                  return (
                    '<th' +
                    style +
                    '>' +
                    h[0] +
                    '<span class="fi">▼</span></th>'
                  );
                if (!h[1]) return '<th' + style + '>' + h[0] + '</th>';
                return (
                  '<th class="sortable" data-key="' +
                  h[1] +
                  '"' +
                  style +
                  '>' +
                  h[0] +
                  '<span class="sort">▲<br>▼</span></th>'
                );
              })
              .join('') +
            '</tr>';
          bindSort();
        }

        function teamRowsHtml() {
          return teams
            .map(function (t, n) {
              var total = t.todo + t.doing + t.done,
                rate = total ? Math.round((t.done / total) * 100) : 0,
                open = !!opened[t.name];
              var head =
                '<tr data-row="' +
                n +
                '"' +
                (open ? ' class="open"' : '') +
                '><td class="idx num">' +
                (n + 1) +
                '</td>' +
                '<td style="text-align:left;padding-left:24px"><button class="team" data-toggle="' +
                n +
                '" ' +
                'aria-expanded="' +
                open +
                '"><span class="caret">' +
                (open ? '⌄' : '›') +
                '</span>' +
                t.name +
                '</button></td>' +
                '<td class="num">' +
                t.repos +
                ' <span style="color:var(--muted);font-size:12px">个</span></td>' +
                '<td><span class="scorecell">' +
                spark(t.score, bandColor(t.score)) +
                '<b class="score num">' +
                t.score.toFixed(1) +
                '</b></span></td>' +
                '<td>' +
                progress(t) +
                '</td>' +
                '<td><a href="#" class="num">' +
                total +
                '</a></td>' +
                '<td><span class="scorecell">' +
                rateSpark(rate) +
                '<b class="num">' +
                rate +
                '%</b></span></td>' +
                '<td class="dash">-</td></tr>';
              var kids = t.list
                .map(function (r) {
                  return (
                    '<tr class="child"' +
                    (open ? '' : ' hidden') +
                    '>' +
                    '<td></td>' +
                    '<td style="text-align:left;padding-left:24px"><a href="#" class="repo">' +
                    r[0] +
                    '</a></td>' +
                    '<td class="dash">-</td>' +
                    '<td><span class="scorecell">' +
                    spark(r[1], bandColor(r[1])) +
                    '<b class="score num">' +
                    r[1].toFixed(1) +
                    '</b></span></td>' +
                    '<td>' +
                    progress({ todo: r[2], doing: 0, done: 0 }) +
                    '</td>' +
                    '<td><a href="#" class="num">' +
                    r[2] +
                    '</a></td>' +
                    '<td><span class="scorecell">' +
                    rateSpark(0) +
                    '<b class="num">0%</b></span></td>' +
                    '<td><a href="#">查看报告</a></td></tr>'
                  );
                })
                .join('');
              return head + kids;
            })
            .join('');
        }

        /* 仓库维度：直接平铺 46 个仓库 */
        var repoRows = [];
        teams.forEach(function (t) {
          t.list.forEach(function (r) {
            repoRows.push({
              name: r[0],
              team: t.name,
              score: r[1],
              todo: r[2],
              doing: 0,
              done: 0,
            });
          });
        });
        function repoRowsHtml() {
          return repoRows
            .map(function (r, n) {
              var total = r.todo + r.doing + r.done,
                rate = total ? Math.round((r.done / total) * 100) : 0;
              return (
                '<tr><td class="idx num">' +
                (n + 1) +
                '</td>' +
                '<td style="text-align:left;padding-left:24px"><a href="#" class="repo" ' +
                'style="padding-left:0">' +
                r.name +
                '</a></td>' +
                '<td style="color:var(--sub)">' +
                r.team +
                '</td>' +
                '<td><span class="scorecell">' +
                spark(r.score, bandColor(r.score)) +
                '<b class="score num">' +
                r.score.toFixed(1) +
                '</b></span></td>' +
                '<td>' +
                progress(r) +
                '</td>' +
                '<td><a href="#" class="num">' +
                total +
                '</a></td>' +
                '<td><span class="scorecell">' +
                rateSpark(rate) +
                '<b class="num">' +
                rate +
                '%</b></span></td>' +
                '<td><a href="#">查看报告</a></td></tr>'
              );
            })
            .join('');
        }

        function drawTeams() {
          document.querySelector('#teamTbl tbody').innerHTML =
            dim === 'team' ? teamRowsHtml() : repoRowsHtml();
        }
        drawHead();
        drawTeams();

        document
          .querySelector('#teamTbl tbody')
          .addEventListener('click', function (e) {
            var b = e.target.closest('[data-toggle]');
            if (!b) return;
            opened[teams[b.dataset.toggle].name] =
              !opened[teams[b.dataset.toggle].name];
            drawTeams();
          });

        /* 排序：两个维度各自生效 */
        var sortDir = {};
        function bindSort() {
          document
            .querySelectorAll('#teamTbl th.sortable')
            .forEach(function (th) {
              th.addEventListener('click', function () {
                var k = th.dataset.key;
                sortDir[k] = sortDir[k] === 1 ? -1 : 1;
                var pick =
                  dim === 'team'
                    ? function (t) {
                        var tot = t.todo + t.doing + t.done;
                        return {
                          name: t.name,
                          repos: t.repos,
                          score: t.score,
                          total: tot,
                          rate: tot ? t.done / tot : 0,
                          report: 0,
                        }[k];
                      }
                    : function (r) {
                        var tot = r.todo + r.doing + r.done;
                        return {
                          name: r.name,
                          team: r.team,
                          score: r.score,
                          total: tot,
                          rate: tot ? r.done / tot : 0,
                          report: 0,
                        }[k];
                      };
                (dim === 'team' ? teams : repoRows).sort(function (a, b) {
                  var x = pick(a),
                    y = pick(b);
                  return (
                    (typeof x === 'string' ? x.localeCompare(y, 'zh') : x - y) *
                    sortDir[k]
                  );
                });
                drawTeams();
              });
            });
        }

        /* 维度切换 */
        document.querySelectorAll('#dimSwitch button').forEach(function (b) {
          b.addEventListener('click', function () {
            document
              .querySelectorAll('#dimSwitch button')
              .forEach(function (x) {
                x.classList.remove('on');
              });
            b.classList.add('on');
            dim = b.dataset.dim;
            drawHead();
            drawTeams();
          });

        /* ---------- TOP 问题 ---------- */
        var TOPISSUES = [
          {

            mi: 3,
            p: 0,
            repos: 38,

          {

          {

            rate: 34.0,
            tr: [18.2, 21.4, 23.9, 26.1, 28.5, 30.2, 32.4, 34.0],
          },
          {
            t: '关闭时缺少结论与复用价值',
            mi: 9,
            p: 1,
            repos: 22,
            n: 41,
            rate: 24.4,
            tr: [11.2, 13.6, 15.1, 17.8, 19.4, 21.2, 23.1, 24.4],
          },
          {
            t: '首响仅确认收到，无实质信息',
            mi: 4,
            p: 0,
            repos: 21,
            n: 44,
            rate: 9.1,
            tr: [2.4, 3.1, 4.2, 5.0, 6.3, 7.1, 8.2, 9.1],
          },
          {
            t: '责任分配错误或反复流转',
            mi: 5,
            p: 2,
            repos: 19,
            n: 33,
            rate: 27.3,
            tr: [14.8, 16.2, 18.9, 20.4, 22.7, 24.1, 26.0, 27.3],
          },
          {
            t: '修复合入后未及时关闭',
            mi: 10,
            p: 1,
            repos: 17,
            n: 39,
            rate: 41.0,
            tr: [24.6, 27.8, 30.1, 33.4, 35.9, 37.6, 39.4, 41.0],
          },
        ];
        TOPISSUES.forEach(function (x) {
          x.done = Math.round((x.n * x.rate) / 100);
          x.open = x.n - x.done;
        });

        function lineSpark(v, col, w, h) {
          w = w || 120;
          h = h || 26;
          var lo = Math.min.apply(null, v),
            hi = Math.max.apply(null, v),
            rg = hi - lo || 1;
          var pts = v.map(function (y, i) {
            return [
              4 + (i * (w - 8)) / (v.length - 1),
              h - 5 - ((y - lo) / rg) * (h - 12),
            ];
          });
          var d = pts
            .map(function (p, i) {
              return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
            })
            .join(' ');
          var last = pts[pts.length - 1];
          return (
            '<svg width="' +
            w +
            '" height="' +
            h +
            '" viewBox="0 0 ' +
            w +
            ' ' +
            h +
            '" aria-hidden="true">' +
            '<path d="' +
            d +
            'L' +
            (w - 4) +
            ' ' +
            h +
            'L4 ' +
            h +
            'Z" fill="' +
            col +
            '" fill-opacity=".12"/>' +
            '<path d="' +
            d +
            '" fill="none" stroke="' +
            col +
            '" stroke-width="1.8" stroke-linejoin="round"/>' +
            '<circle cx="' +
            last[0].toFixed(1) +
            '" cy="' +
            last[1].toFixed(1) +
            '" r="2.6" fill="' +
            col +
            '" stroke="#fff" stroke-width="1.6"/></svg>'
          );
        }

        var ISSUE_VIEWS = {
          all: {
            col: '问题数',
            pick: function (x) {
              return x.n;
            },
            sort: function (x) {
              return x.repos;
            },
            hint: '按覆盖仓库数排序',
          },
          open: {
            col: '未闭环数',
            pick: function (x) {
              return x.open;
            },
            sort: function (x) {
              return x.open;
            },
            hint: '按未闭环问题数排序',
          },
          done: {
            col: '已闭环数',
            pick: function (x) {
              return x.done;
            },
            sort: function (x) {
              return x.done;
            },
            hint: '按已闭环问题数排序',
          },
        };
        function drawIssues(view) {
          var v = ISSUE_VIEWS[view];
          document.getElementById('issueHint').textContent = v.hint;
          document.getElementById('issueHead').innerHTML =
            '<tr>' +
            '<th style="width:70px">序号</th>' +
            '<th style="text-align:left;padding-left:20px">问题</th>' +
            '<th style="width:130px">阶段</th>' +
            '<th style="width:168px">指标</th>' +
            '<th style="width:100px">优先级</th>' +
            '<th style="width:100px">覆盖仓数</th>' +
            '<th style="width:96px">' +
            v.col +
            '</th>' +
            '<th style="width:120px">增长趋势</th></tr>';
          var rows = TOPISSUES.slice()
            .sort(function (a, b) {
              return v.sort(b) - v.sort(a);
            })
            .slice(0, 5);
          document.querySelector('#issueTbl tbody').innerHTML = rows
            .map(function (x, i) {
              var p = PRIOS[x.p],
                col = x.rate < 20 ? '#F0912B' : '#12A57B';
              var m = METRICS[x.mi];
              return (
                '<tr><td class="idx num">' +
                (i + 1) +
                '</td>' +
                '<td style="text-align:left;padding-left:20px"><b style="font-weight:600">' +
                x.t +
                '</b></td>' +
                '<td style="color:var(--sub)">' +
                m.st +
                '</td>' +
                '<td><div class="mcell" title="' +
                m.name +
                '（' +
                m.key +
                '）· ' +
                m.ax +
                '轴">' +
                m.name +
                '<span class="axis ' +
                (m.ax === '效率' ? 'e' : 'q') +
                '">' +
                m.ax +
                '</span></div></td>' +
                '<td><span class="tag" style="background:' +
                p.c +
                '1A;color:' +
                p.c +
                '">' +
                p.k.split(' ')[0] +
                '</span></td>' +
                '<td class="num">' +
                x.repos +
                ' <span style="color:var(--muted);font-size:12px">个</span></td>' +
                '<td><a href="#" class="num" title="共 ' +
                x.n +
                ' 个，已闭环 ' +
                x.done +
                '，未闭环 ' +
                x.open +
                '">' +
                v.pick(x) +
                '</a></td>' +
                '<td title="近 8 周闭环率：' +
                x.tr[0].toFixed(1) +
                '% → ' +
                x.rate.toFixed(1) +
                '%">' +
                '<span class="scorecell">' +
                lineSpark(x.tr, col, 38, 22) +
                '</span></td></tr>'
              );
            })
            .join('');
        }
        drawIssues('all');
        document.querySelectorAll('#issueDim button').forEach(function (b) {
          b.addEventListener('click', function () {
            document.querySelectorAll('#issueDim button').forEach(function (x) {
              x.classList.remove('on');
            });
            b.classList.add('on');
            drawIssues(b.dataset.view);
          });
        });

        /* 顶部分区切换 */
        document.querySelectorAll('.segs button').forEach(function (b) {
          b.addEventListener('click', function () {
            document.querySelectorAll('.segs button').forEach(function (x) {
              x.classList.remove('on');
              x.setAttribute('aria-selected', 'false');
            });
            b.classList.add('on');
            b.setAttribute('aria-selected', 'true');
          });
        });
      })();
    </script>
  </body>
</html>
